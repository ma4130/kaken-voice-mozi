name: Publish voice art with Vosk
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache
          key: vosk-ja-0.22-runtime-0.0.8-v1
      - name: Prepare verified offline speech assets
        run: python scripts/prepare-vosk.py
      - name: Assemble static website
        run: |
          mkdir -p _site
          cp index.html game.js style.css .nojekyll _site/
          cp -r vosk _site/vosk
          cp -r hiragana _site/hiragana
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

