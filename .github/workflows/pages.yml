name: Publish voice art with Vosk
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/cache@v4
        with:
          path: .cache
          key: vosk-ja-0.22-runtime-0.0.8-hiragana-v2
      - name: Prepare verified offline speech assets
        run: python scripts/prepare-vosk.py
      - name: Prepare local hiragana conversion assets
        run: |
          npm install --prefix .cache/hiragana --no-save --ignore-scripts --no-audit --no-fund kuroshiro@1.2.1 kuroshiro-analyzer-kuromoji@1.1.0 kuromoji@0.1.2
          mkdir -p hiragana/vendor hiragana/dict hiragana/licenses
          cp .cache/hiragana/node_modules/kuroshiro/dist/kuroshiro.min.js hiragana/vendor/
          cp .cache/hiragana/node_modules/kuroshiro-analyzer-kuromoji/dist/kuroshiro-analyzer-kuromoji.min.js hiragana/vendor/
          cp .cache/hiragana/node_modules/kuromoji/dict/* hiragana/dict/
          cp vosk/LICENSE-APACHE-2.0.txt hiragana/licenses/kuromoji-APACHE-2.0.txt
      - name: Assemble static website
        run: |
          mkdir -p _site
          cp index.html game.js style.css .nojekyll _site/
          cp -r vosk _site/vosk
          cp -r hiragana _site/hiragana
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

